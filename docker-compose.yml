# Dev MySQL for Taskflow. Start with: docker compose up -d
# Credentials are dev-only defaults; override via .env (MYSQL_USER, MYSQL_PASSWORD,
# MYSQL_ROOT_PASSWORD, MYSQL_PORT) if 3306 is taken on your machine.
services:
  db:
    image: mysql:8.4
    container_name: taskflow-mysql
    environment:
      MYSQL_DATABASE: todo
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  db-data:
