spring.application.name=todo-api

# Dev MySQL from the repo-root docker-compose.yml (docker compose up -d).
# MYSQL_PORT mirrors the compose override for machines where 3306 is taken.
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3306}/todo
spring.datasource.username=todo
spring.datasource.password=todo

# Flyway owns the schema; Hibernate only validates against it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
